<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чертожна дъска: графики, фигури и тела</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D5BBF">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чертожна дъска">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F8FB; --panel:#FFFFFF; --field:#EEF2F8; --ink:#1B2638; --ink-soft:#5A677D; --line:#DCE3EE;
  --grid:#E9EEF6; --grid-major:#CCD7E6; --axis:#2A3548; --accent:#1D5BBF; --accent-soft:#E2EBFA; --accent-ink:#FFFFFF;
  --err:#B42318; --ok:#1E7A3C;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11171F; --panel:#18202B; --field:#212B38; --ink:#E5EBF4; --ink-soft:#9AA8BC; --line:#2B3646;
    --grid:#19222D; --grid-major:#2A3647; --axis:#C9D4E3; --accent:#7AA7F2; --accent-soft:#1E2E48; --accent-ink:#0E1520;
    --err:#F08A80; --ok:#6FCF8E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11171F; --panel:#18202B; --field:#212B38; --ink:#E5EBF4; --ink-soft:#9AA8BC; --line:#2B3646;
  --grid:#19222D; --grid-major:#2A3647; --axis:#C9D4E3; --accent:#7AA7F2; --accent-soft:#1E2E48; --accent-ink:#0E1520;
  --err:#F08A80; --ok:#6FCF8E;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(300px,360px) 1fr;height:100%}
.panel{display:flex;flex-direction:column;gap:14px;padding:18px 16px 14px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.brand h1{font-size:21px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:3px;gap:3px}
.modes button{border:0;background:transparent;color:var(--ink-soft);font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer}
.modes button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.14)}
.cmd{display:flex;gap:6px}
.cmd input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}
.cmd input:focus{outline:none;border-color:var(--accent)}
.btn{font-weight:600;border:0;border-radius:9px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.kbtn{width:42px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.kbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.keypad{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:-6px}
.keypad button{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-size:16px;cursor:pointer;padding:0;min-width:0;touch-action:manipulation}
.keypad button:active{background:var(--accent-soft)}
.keypad .fn{font-size:13.5px}
.keypad .var{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:19px}
.keypad .num{background:var(--panel);font-weight:600}
.keypad .go{grid-column:span 4;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;border-color:var(--accent)}
.msg{min-height:1.2em;font-size:13.5px;margin-top:-8px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
details.help summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.help p{font-size:13px;color:var(--ink-soft);margin:8px 0 0}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.sec{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodies button{display:flex;align-items:center;gap:8px;text-align:left;font-size:13.5px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;padding:7px 9px;cursor:pointer}
.bodies svg{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list .sechead{padding-top:6px}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:start;padding:8px 2px;border-bottom:1px solid var(--line)}
.dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--c);background:var(--c);cursor:pointer;margin-top:3px;padding:0}
.item.off .dot{background:transparent}
.item.off .desc,.item.off .ro{opacity:.45}
.desc{font-size:14.5px;word-break:break-word;font-variant-numeric:tabular-nums}
.desc strong{font-weight:600}
.del{border:0;background:transparent;color:var(--ink-soft);font-size:20px;line-height:1;cursor:pointer;padding:0 5px 2px;border-radius:6px}
.del:hover{color:var(--err)}
.vec{position:relative;display:inline-block;font-style:italic;font-family:"Times New Roman",Georgia,serif;font-size:1.1em;padding-top:.34em;line-height:1}
.vec::before{content:"";position:absolute;left:1px;right:4px;top:.12em;border-top:1.4px solid currentColor}
.vec::after{content:"";position:absolute;right:0;top:calc(.12em - 3px);border-left:6px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.cbtn{width:22px;height:22px;border-radius:6px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0;margin-top:1px}
.cpal{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px 26px}
.cpal button{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.cpal button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.cpal .lsb{width:auto;height:auto;border-radius:6px;box-shadow:none;font-size:11.5px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:3px 7px;cursor:pointer}
.cpal .lsb[aria-pressed="true"]{box-shadow:none;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dsh{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink)}
.oprow{flex-wrap:wrap;width:100%;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.oprow input{flex:1;accent-color:var(--accent)}
.opv{min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.fields{grid-column:2/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.fields label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-soft);gap:2px}
.fields input{font:inherit;font-size:15px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
.fields .cap{grid-column:1/-1;font-size:12px;color:var(--ink-soft);margin-top:2px}
.ro{grid-column:2/-1;white-space:pre-line;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--field);border-radius:8px;padding:6px 9px}
.slider{grid-template-columns:auto 1fr 62px auto auto;align-items:center}
.slider .nm{font-weight:600;font-style:italic;font-family:"Times New Roman",Georgia,serif;font-size:17px}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.slider input[type=text]{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);width:100%}
.play{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;width:30px;height:28px;cursor:pointer;font-size:12px}
.empty{font-size:13.5px;color:var(--ink-soft);padding:6px 2px}
.author{display:flex;align-items:center;gap:8px}
.author img{width:30px;height:30px;flex:0 0 auto;opacity:.9}
.footer{margin-top:auto;padding-top:6px;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ghost{font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:5px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.ghost.warn{border-color:var(--err);color:var(--err)}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.stage{-webkit-touch-callout:none}
.toolbar{position:absolute;top:10px;left:10px;display:flex;gap:2px;overflow-x:auto;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(20,30,50,.08);max-width:calc(100% - 20px);scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--ink);padding:6px 5px 4px;border-radius:8px;cursor:pointer;font-size:11px;min-width:64px}
.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.hint{position:absolute;left:12px;bottom:62px;max-width:min(470px,calc(100% - 80px));font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink-soft);pointer-events:none}
.hint.flash{color:var(--err);border-color:var(--err)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.coords{position:absolute;right:62px;bottom:16px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;pointer-events:none}

.tool span{white-space:nowrap}
[hidden]{display:none!important}
.fields .wide{grid-column:1/-1}
.boardbar{position:absolute;left:10px;top:84px;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(20,30,50,.08);max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
.boardbar::-webkit-scrollbar{display:none}
.bt{width:42px;height:42px;border:0;background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;padding:0}
.bt svg,.zoom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.boardbar.collapsed>:not(.bt-toggle){display:none}
.boardbar .sep{height:1px;background:var(--line);margin:3px 4px;flex:0 0 auto}
.palette{position:absolute;left:66px;top:84px;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(20,30,50,.08)}
.palette .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:236px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:2px}
.sz{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--field);display:grid;place-items:center;cursor:pointer;padding:0}
.sz i{display:block;border-radius:50%}
.sz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.quick{position:absolute;left:12px;bottom:108px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;color:var(--ink-soft);max-width:calc(100% - 80px)}
.quick button{min-width:34px;height:30px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;cursor:pointer;font-weight:600}
.inktext{position:absolute;z-index:5;min-width:140px;margin:0;background:var(--panel);border:1.5px dashed var(--accent);border-radius:6px;padding:2px 4px;font-family:"Golos Text",system-ui,sans-serif;font-weight:500;line-height:1.25;resize:none;overflow:hidden;outline:none}
.pagebar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(20,30,50,.08)}
.pagebar button{width:36px;height:36px;border:0;background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:22px;line-height:1;padding:0}
.pagebar button:disabled{opacity:.3;cursor:default}
.pagebar button.warn{color:var(--err);background:var(--field)}
.pagebar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pagebar span{font-size:13px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
#printArea{display:none}
@media print{
  html,body{height:auto;background:#fff}
  body>.app{display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:100%;height:auto;max-height:185mm;object-fit:contain;margin:0 auto;break-after:page;page-break-after:always}
  #printArea img.portrait{max-height:272mm}
  #printArea img:last-child{break-after:auto;page-break-after:auto}
}
.cons{display:flex;flex-direction:column;gap:8px}
.cons select{width:100%;font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.consArgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.consArgs label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-soft)}
.cons .btn{align-self:flex-start}
.geo-btn{position:absolute;left:12px;bottom:12px;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:0 3px 12px rgba(20,30,50,.12);padding:3px;cursor:pointer;display:grid;place-items:center}
.geo-btn img{width:100%;height:100%;object-fit:contain}
.geo-btn[aria-expanded="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.geo{position:absolute;left:12px;bottom:80px;display:flex;align-items:flex-end;gap:4px;max-width:min(480px,calc(100% - 24px));z-index:4;pointer-events:none}
.geo>*{pointer-events:auto}
.geo-img{width:104px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(20,30,50,.18))}
.geo-bubble{position:relative;background:var(--panel);border:1.5px solid var(--accent);border-radius:14px;padding:10px 12px 10px;box-shadow:0 6px 20px rgba(20,30,50,.14);margin-bottom:46px;min-width:0}
.geo-bubble::before{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--panel);border-left:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);transform:rotate(45deg)}
.geo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.geo-head strong{font-size:14px;color:var(--accent)}
.geo-x{border:0;background:transparent;color:var(--ink-soft);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.geo p{margin:6px 0 8px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.geo-nav{display:flex;align-items:center;gap:8px}
.geo-nav button{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.geo-nav button:disabled{opacity:.35;cursor:default}
.geo-nav span{font-size:12px;color:var(--ink-soft);flex:1;text-align:center}
.geo-tasks{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.geo-tasks span{font-size:12px;color:var(--ink-soft);width:100%}
.geo-tasks button{font-size:12.5px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer}
.showpanel{display:none;position:absolute;top:10px;right:12px;z-index:5;font-weight:600;font-size:14px;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 12px rgba(20,30,50,.12)}
.app.wide .showpanel{display:block}
.app.wide .toolbar{max-width:calc(100% - 200px)}
.resume{position:fixed;inset:0;background:rgba(15,22,35,.45);display:grid;place-items:center;z-index:50;padding:16px}
.resume-card{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px 22px 18px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(15,22,35,.3);text-align:center}
.resume-card img{width:96px;height:auto}
.resume-card h2{margin:6px 0 6px;font-size:20px}
.resume-card p{margin:0 0 16px;color:var(--ink-soft);font-size:14.5px}
.resume-btns{display:flex;flex-direction:column;gap:8px}
.resume-btns .ghost{font-size:14px;padding:9px 12px}
.app.wide{grid-template-columns:1fr;grid-template-rows:1fr}
.app.wide .panel{display:none}
@media (max-width:760px){
  .app.wide{grid-template-rows:1fr}
  .boardbar,.palette{top:74px}
  .pagebar{left:74px;transform:none}
  .geo{bottom:74px}
  .geo-img{width:72px}
  .geo-btn{width:52px;height:52px}
  .app{grid-template-columns:1fr;grid-template-rows:minmax(300px,56%) 1fr}
  .stage{order:-1}
  .panel{border-right:0;border-top:1px solid var(--line);padding:14px 14px 12px}
  .brand p{display:none}
  .tool{min-width:56px;font-size:10.5px}
  .coords{display:none}
  .hint{font-size:12px;padding:6px 9px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <div class="brandrow"><h1>Чертожна дъска</h1><button class="ghost" id="hidePanel" type="button" title="Скрий панела. Връща се с бутона вдясно долу на дъската.">Скрий панела</button></div>
      <p>Графики на функции, фигури в равнината, тела и равнини в пространството</p>
    </header>

    <div class="modes" role="tablist" aria-label="Режим">
      <button role="tab" id="tab2d" aria-selected="true" data-mode="2d">Равнина (2D)</button>
      <button role="tab" id="tab3d" aria-selected="false" data-mode="3d">Пространство (3D)</button>
    </div>

    <form class="cmd" id="cmdForm" autocomplete="off">
      <input id="cmd" type="text" spellcheck="false" aria-label="Въведи уравнение или точка" placeholder="напр. y = 2x + 1">

<script>
(function(){
'use strict';

/* ================= PARSER-START ================= */
const FUNCS={sin:Math.sin,cos:Math.cos,tg:Math.tan,tan:Math.tan,cotg:x=>1/Math.tan(x),ctg:x=>1/Math.tan(x),cot:x=>1/Math.tan(x),
  arcsin:Math.asin,arccos:Math.acos,arctg:Math.atan,arctan:Math.atan,arccotg:x=>Math.PI/2-Math.atan(x),
  sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,ln:Math.log,lg:Math.log10,log:Math.log10,exp:Math.exp,sign:Math.sign,
  floor:Math.floor,ceil:Math.ceil,round:Math.round};
const CONSTS={pi:Math.PI,e:Math.E};
const NAMES=[...Object.keys(FUNCS),'pi'].sort((a,b)=>b.length-a.length);

function userErr(m){const e=new Error(m);e.user=true;return e;}
function powR(b,ex){
  if(b>=0||Number.isInteger(ex)) return Math.pow(b,ex);
  for(let q=3;q<=15;q+=2){const pq=ex*q;if(Math.abs(pq-Math.round(pq))<1e-9){const v=Math.pow(-b,ex);return (Math.round(pq)%2===0)?v:-v;}}
  return NaN;
}
function normalizeExpr(s){
  return s.replace(/[−–—]/g,'-').replace(/[×·∙⋅]/g,'*').replace(/[÷:]/g,'/')
    .replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/,/g,'.');
}
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));
      if(isNaN(v)) throw userErr('Неразпознато число.');t.push({t:'num',v});i=j;continue;}
    if(/[a-z]/.test(c)){
      let m=null;for(const n of NAMES){if(s.startsWith(n,i)){m=n;break;}}
      if(m){t.push(FUNCS[m]?{t:'fn',v:m}:{t:'const',v:m});i+=m.length;continue;}
      if(c==='e'){t.push({t:'const',v:'e'});i++;continue;}
      t.push({t:'var',v:c});i++;continue;
    }
    if(/[A-Z]/.test(c)) throw userErr('Главните букви са за имена на точки. В изрази използвай малки букви.');
    if('+-*/^()|'.includes(c)){t.push({t:'op',v:c});i++;continue;}
    throw userErr('Непознат знак „'+c+'“.');
  }

/* ---------- commands ---------- */
function parsePointLiteral(s,dim){
  const m=s.match(/^\s*([A-Z][A-Za-z0-9_']*)?\s*=?\s*\((.*)\)\s*$/);
  if(!m) return null;
  const inner=m[2];
  const parts=inner.includes(';')?inner.split(';'):splitTop(inner,',');
  if(parts.length<2) return null;
  const comps=[];
  for(const part of parts){
    if(!part.trim()) return null;
    let P;try{P=compile(part,[]);}catch(e){return null;}
    if(P.vars.has('x')||P.vars.has('y')||P.vars.has('z')) return null;
    comps.push(P);
  }
  if(parts.length!==dim){
    throw userErr(dim===2?'В равнината точката има две координати, напр. A(2; 3). За три координати премини към „Пространство“.':'В пространството точката има три координати, напр. A(1; 2; 3).');
  }
  const params=[...new Set(comps.flatMap(c=>c.params))];
  ensureSliders(params);
  return {name:m[1]||null,coords:comps.map(c=>c.f(ENV))};
}
function parseBase(src){
  const s=fixLetters(src).replace(/[−–]/g,'-');const re=/([A-Z][0-9]*)?\s*\(\s*([^;()]+?)\s*;\s*([^;()]+?)\s*\)/g;
  const pts=[],names=[];let m;
  while((m=re.exec(s))){const x=parseFloat(m[2].replace(',','.')),y=parseFloat(m[3].replace(',','.'));if(!isFinite(x)||!isFinite(y))return null;pts.push([x,y]);names.push(m[1]||'');}
  if(pts.length<3||pts.length>12)return null;
  let A=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];A+=p[0]*q[1]-q[0]*p[1];}
  if(Math.abs(A)<1e-9)return null;
  const nms=names.map((n,i)=>n||VLAB[i]);
  if(A<0){pts.reverse();nms.reverse();}
  return {pts,names:nms,S:Math.abs(A)/2};
}

function cmd2D(raw){

function linearCoeffs(G){
  const ev=(x,y,z)=>{ENV.x=x;ENV.y=y;ENV.z=z;return G(ENV);};
  const c0=ev(0,0,0),a=ev(1,0,0)-c0,b=ev(0,1,0)-c0,c=ev(0,0,1)-c0;
  if(![c0,a,b,c].every(isFinite)) return null;
  const tests=[[2.3,-1.7,0.9],[-3.1,2.2,-1.4],[0.7,3.9,2.6],[-1.2,-2.5,3.3]];
  for(const [x,y,z] of tests){const g=ev(x,y,z);if(!isFinite(g)||Math.abs(g-(c0+a*x+b*y+c*z))>1e-7*(1+Math.abs(g)))return null;}
  if(Math.abs(a)+Math.abs(b)+Math.abs(c)<1e-12) return null;
  return {a,b,c,d:-c0};
}

/* ================= 2D ================= */
const w2s=(x,y)=>[W/2+(x-st.v2.cx)*st.v2.scale,H/2-(y-st.v2.cy)*st.v2.scale];
const s2w=(sx,sy)=>[(sx-W/2)/st.v2.scale+st.v2.cx,-(sy-H/2)/st.v2.scale+st.v2.cy];
function niceStep(u){
  const p=Math.pow(10,Math.floor(Math.log10(u)));const m=u/p;
  if(m<=1)return {step:p,mant:1,p10:p};if(m<=2)return {step:2*p,mant:2,p10:p};if(m<=5)return {step:5*p,mant:5,p10:p};
  return {step:10*p,mant:1,p10:10*p};
}
function gridInfo(){return niceStep(48/st.v2.scale);}
function snapW(x,y){
  if(!st.opt.snap) return [x,y];
  const s=gridInfo().p10;
  return [Math.round(x/s)*s,Math.round(y/s)*s];
}
function tickText(v,step){const dec=Math.max(0,-Math.floor(Math.log10(step)+1e-9));return v.toFixed(dec).replace('-','−').replace('.',',');}

function drawGrid2D(T){
  const gi=gridInfo(),step=gi.step,minor=step/(gi.mant===2?4:5);
  const [x0,y1]=s2w(0,0),[x1,y0]=s2w(W,H);
  ctx.lineWidth=1;
  if(st.opt.grid||st.opt.squares){
    for(const [sp,col] of (st.opt.squares?[[step/2,T.major]]:[[minor,T.grid],[step,T.major]])){
      if(sp*st.v2.scale<6) continue;
      ctx.strokeStyle=col;ctx.beginPath();
      for(let v=Math.ceil(x0/sp)*sp;v<=x1;v+=sp){const sx=Math.round(w2s(v,0)[0])+.5;ctx.moveTo(sx,0);ctx.lineTo(sx,H);}
      for(let v=Math.ceil(y0/sp)*sp;v<=y1;v+=sp){const sy=Math.round(w2s(0,v)[1])+.5;ctx.moveTo(0,sy);ctx.lineTo(W,sy);}
      ctx.stroke();
    }
  }
  if(!st.opt.axes)return;
  const [ox,oy]=w2s(0,0);
  const ax=Math.min(Math.max(ox,0),W),ay=Math.min(Math.max(oy,0),H);
  ctx.strokeStyle=T.axis;ctx.fillStyle=T.axis;ctx.lineWidth=1.4;ctx.beginPath();
  if(oy>=0&&oy<=H){ctx.moveTo(0,oy);ctx.lineTo(W-2,oy);}
  if(ox>=0&&ox<=W){ctx.moveTo(ox,H);ctx.lineTo(ox,2);}
  ctx.stroke();
  if(oy>=0&&oy<=H){ctx.beginPath();ctx.moveTo(W-2,oy);ctx.lineTo(W-12,oy-5);ctx.lineTo(W-12,oy+5);ctx.fill();
    text('x',W-14,oy-9,{color:T.ink,font:'italic 17px "Times New Roman",Georgia,serif',align:'right',halo:T.paper});}
  if(ox>=0&&ox<=W){ctx.beginPath();ctx.moveTo(ox,2);ctx.lineTo(ox-5,12);ctx.lineTo(ox+5,12);ctx.fill();
    text('y',ox+10,18,{color:T.ink,font:'italic 17px "Times New Roman",Georgia,serif',halo:T.paper});}
  const lo={color:T.soft,halo:T.paper};
  const ly=Math.min(Math.max(ay+5,4),H-18);
  for(let v=Math.ceil(x0/step)*step;v<=x1;v+=step){
    if(Math.abs(v)<step/2)continue;const sx=w2s(v,0)[0];if(sx>W-24)continue;
    ctx.strokeStyle=T.axis;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx,ay-3);ctx.lineTo(sx,ay+3);ctx.stroke();
    text(tickText(v,step),sx,ly,Object.assign({align:'center',base:'top'},lo));
  }
  const lx=Math.min(Math.max(ax-6,30),W-4);
  for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step){
    if(Math.abs(v)<step/2)continue;const sy=w2s(0,v)[1];if(sy<22)continue;
    ctx.strokeStyle=T.axis;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ax-3,sy);ctx.lineTo(ax+3,sy);ctx.stroke();
    text(tickText(v,step),lx,sy,Object.assign({align:'right',base:'middle'},lo));
  }
  if(ox>=0&&ox<=W&&oy>=0&&oy<=H) text('O',ox-6,oy+5,{color:T.soft,align:'right',base:'top',halo:T.paper,font:'italic 14px "Times New Roman",Georgia,serif'});
}
function evalF(f,x){ENV.x=x;try{return f(ENV);}catch(e){return NaN;}}
function drawFunc(o){
  ctx.strokeStyle=o.color;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
  let pen=false,prev=null;
  for(let px=0;px<=W;px+=1){
    const x=s2w(px,0)[0];const y=evalF(o.f,x);
    if(!isFinite(y)){pen=false;prev=null;continue;}
    let sy=w2s(0,y)[1];
    if(prev!==null&&Math.abs(sy-prev)>H*1.5) pen=false;
    prev=sy;sy=Math.max(-1e4,Math.min(1e4,sy));
    if(!pen){ctx.moveTo(px,sy);pen=true;}else ctx.lineTo(px,sy);
  }
  ctx.stroke();
}
function drawImplicit(o){
  const cs=5,nx=Math.ceil(W/cs)+1,ny=Math.ceil(H/cs)+1;const v=new Float64Array(nx*ny);
  const F=(x,y)=>{ENV.x=x;ENV.y=y;try{return o.F(ENV);}catch(e){return NaN;}};
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const [x,y]=s2w(i*cs,j*cs);v[j*nx+i]=F(x,y);}
  ctx.strokeStyle=o.color;ctx.lineWidth=2.5;ctx.beginPath();
  const ok=(sx,sy,va,vb)=>{const [x,y]=s2w(sx,sy);const f=F(x,y);return isFinite(f)&&Math.abs(f)<=Math.max(Math.abs(va),Math.abs(vb));};
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const a=v[j*nx+i],b=v[j*nx+i+1],c=v[(j+1)*nx+i+1],d=v[(j+1)*nx+i];
    if(!(isFinite(a)&&isFinite(b)&&isFinite(c)&&isFinite(d)))continue;
    const pts=[];
    if((a>0)!==(b>0)){const t=a/(a-b);pts.push([(i+t)*cs,j*cs,a,b]);}
    if((b>0)!==(c>0)){const t=b/(b-c);pts.push([(i+1)*cs,(j+t)*cs,b,c]);}
    if((d>0)!==(c>0)){const t=d/(d-c);pts.push([(i+t)*cs,(j+1)*cs,d,c]);}
    if((a>0)!==(d>0)){const t=a/(a-d);pts.push([i*cs,(j+t)*cs,a,d]);}
    for(let k=0;k+1<pts.length;k+=2){
      const p1=pts[k],p2=pts[k+1];
      if(!ok(p1[0],p1[1],p1[2],p1[3])||!ok(p2[0],p2[1],p2[2],p2[3]))continue;
      ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);
    }
  }
  ctx.stroke();
}
function drawInfLine(p,d,color,lw,dash){
  const len=Math.hypot(d.x,d.y);if(!(len>1e-12)||!isFinite(p.x))return;
  const ux=d.x/len,uy=d.y/len;const R=(Math.hypot(W,H)/st.v2.scale)+Math.hypot(p.x-st.v2.cx,p.y-st.v2.cy);
  const [ax,ay]=w2s(p.x-ux*R,p.y-uy*R),[bx,by]=w2s(p.x+ux*R,p.y+uy*R);
  ctx.strokeStyle=color;ctx.lineWidth=lw||2;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);
}

function iptPos(o){

function hitShapes(sx,sy){
  const R=st.lastPtrType==='touch'?16:10,out=[];
  const segD=(p,d,clamp)=>{const [ax,ay]=w2s(p.x,p.y),[bx,by]=w2s(p.x+d.x,p.y+d.y);const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(!(l2>1e-9))return Infinity;

    const L=interList(A,B);

    const uniq=[];ok.forEach(q=>{if(!uniq.some(u=>Math.hypot(u.p.x-q.p.x,u.p.y-q.p.y)<1e-9))uniq.push(q);});
    if(!uniq.length){setHint('Тези обекти не се пресичат.',true);render();return;}
    uniq.forEach(q=>{if(st.o2.some(o=>o.type==='ipt'&&o.k===q.k&&((o.a.id===a.id&&o.a.e===a.e&&o.b.id===b.id&&o.b.e===b.e)||(o.a.id===b.id&&o.a.e===b.e&&o.b.id===a.id&&o.b.e===a.e))))return;

  }

}
function hitCircle(sx,sy){
  const R=st.lastPtrType==='touch'?16:9;let best=null,bd=R;

function hitFunc(sx,sy){

function pickPoint(sx,sy){

  if(cid){const C=circleOf(byId(cid));return addObj2({type:'cpoint',c:cid,t:Math.atan2(wy-C.y,wx-C.x),name:nextPointName(st.o2.filter(isPt)),color:FREE_PT}).id;}

function onToolTap(sx,sy){
  const t=st.tool;
  if(t==='inter'){
    const hits=hitShapes(sx,sy);
    if(!st.pending.length){
      if(hits.length>=2){makeInter(hits[0],hits[1],sx,sy);return;}
      if(hits.length===1){st.pending=[hits[0].id];st.pendEdge=hits[0].e;st.pendInter=hits[0];render();return;}
      setHint('Докосни първия обект или мястото, където се пресичат два обекта.',true);return;
    }
    const a=st.pendInter,h=hits.find(x=>!(x.id===a.id&&x.e===a.e));
    if(!h){setHint('Избери втори обект.',true);return;}
    st.pending=[];st.pendEdge=null;makeInter(a,h,sx,sy);return;
  }
  if(t==='vsum'||t==='vdiff'||t==='vmove'){
    if(!st.pending.length){const v=hitVec(sx,sy);if(v){st.pending=[v];render();}else setHint('Първо избери вектор (докосни стрелката).',true);return;}
    const v0=byId(st.pending[0]);
    if(t==='vmove'){const p=pickPoint(sx,sy);const tm=vecTerms(v0);addObj2({type:'vexpr',start:p,terms:tm,src:termsSrc(tm)});st.pending=[];changed();return;}
    const v=hitVec(sx,sy);if(!v||v===st.pending[0]){setHint('Избери втори вектор.',true);return;}
    const t1=vecTerms(v0),t2=vecTerms(byId(v)).map(x=>({k:t==='vdiff'?-x.k:x.k,a:x.a,b:x.b}));const tm=[...t1,...t2];
    addObj2({type:'vexpr',start:v0.type==='vec'?v0.a:v0.start,terms:tm,src:termsSrc(tm)});st.pending=[];changed();return;
  }
  if(t==='tangent'){
    if(!st.pending.length){
      const fid=hitFunc(sx,sy);
      if(fid){const p=addObj2({type:'fpoint',f:fid,x:snapX(s2w(sx,sy)[0]),name:nextPointName(st.o2.filter(isPt)),color:FREE_PT});addObj2({type:'ftan',p:p.id});changed();return;}
      const cid=hitCircle(sx,sy);
      if(cid){st.pending=[cid];setHint('Сега избери точка върху окръжността или извън нея.');render();return;}
      setHint('Докосни графика на функция или окръжност.',true);return;
    }
    const cid=st.pending[0],pid=pickPoint(sx,sy);st.pending=[];
    const C=circleOf(byId(cid)),p=P(pid),po=byId(pid);
    const d=C?Math.hypot(p.x-C.x,p.y-C.y):NaN;
    if(!C||!(d>=C.r*(1-1e-6))){setHint('Точката е вътре в окръжността и допирателна няма.',true);changed();return;}
    const on=(po.type==='cpoint'&&po.c===cid)||Math.abs(d-C.r)<1e-6;
    addObj2({type:'ctan',c:cid,p:pid,which:0});if(!on)addObj2({type:'ctan',c:cid,p:pid,which:1});
    setHint();changed();return;
  }
  if(t==='tangpoly'){
    if(!st.pending.length){const cid=hitCircle(sx,sy);if(cid){st.pending=[cid];render();}else setHint('Първо избери окръжност.',true);return;}
    const cid=st.pending[0],C=circleOf(byId(cid));if(!C)return;
    const hit=hitPoint(sx,sy,false),ho=hit&&byId(hit);
    if(hit&&st.pending.length>=4&&hit===st.pending[1]){finishTangPoly(cid,st.pending.slice(1));return;}
    let id;
    if(ho&&ho.type==='cpoint'&&ho.c===cid)id=hit;
    else{const [wx,wy]=s2w(sx,sy);id=addObj2({type:'cpoint',c:cid,t:Math.atan2(wy-C.y,wx-C.x),name:nextPointName(st.o2.filter(isPt)),color:FREE_PT}).id;}
    if(!st.pending.includes(id))st.pending.push(id);changed();return;
  }
  if(t==='point'){if(!hitPoint(sx,sy,false)){pickPoint(sx,sy);changed();}return;}
  if(t==='perp'||t==='par'){
    if(!st.pending.length){const l=hitLine(sx,sy);if(l){st.pending=[l];st.pendEdge=st.hitEdge;render();}else setHint('Първо избери права, отсечка, страна на многоъгълник или вектор.',true);return;}
    const p=pickPoint(sx,sy);addObj2({type:t,l:st.pending[0],e:st.pendEdge==null?undefined:st.pendEdge,p});st.pendEdge=null;st.pending=[];changed();return;
  }
  if(t==='polygon'){
    const hit=hitPoint(sx,sy,false);
    if(hit&&st.pending.length>=3&&hit===st.pending[0]){addObj2({type:'polygon',pts:[...st.pending],name:st.pending.map(nm).join('')});st.pending=[];changed();return;}
    const id=hit||pickPoint(sx,sy);if(!st.pending.includes(id))st.pending.push(id);changed();return;
  }
  const need=TOOL[t].n;const id=pickPoint(sx,sy);
  if(st.pending.includes(id)){render();return;}
  st.pending.push(id);
  if(st.pending.length===need){
    const [a,b,c]=st.pending;let o;
    if(t==='vec'){addObj2({type:'vec',a,b});st.pending=[];changed();return;}
    if(t==='bisect'){const bo=addObj2({type:'bisect',a,v:b,b:c});addObj2({type:'bisL',bis:bo.id,name:uniqueName('L'),color:DEP_PT});st.pending=[];changed();return;}
    if(t==='circ3'||t==='incircle'){const co=addObj2({type:t,a,b,c,name:nextCircleName()});addObj2({type:'center',of:co.id,name:uniqueName(t==='circ3'?'O':'I'),color:DEP_PT});st.pending=[];changed();return;}
    if(t==='segment')o={type:'segment',a,b};
    else if(t==='line')o={type:'line',a,b};
    else if(t==='circle')o={type:'circle',c:a,p:b,name:nextCircleName()};
    else if(t==='mid')o={type:'mid',a,b,name:nextPointName(st.o2.filter(isPt)),color:DEP_PT};
    else if(t==='angle')o={type:'angle',a,v:b,b:c};
    addObj2(o);st.pending=[];
  }
  changed();
}

function pr(v){const r=rot(v);return [W/2+r[0]*S3,H/2+H*0.05-r[1]*S3,r[2]];}

function clipBox(poly,L){

      F=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
      labels=['A','B','C','D','A₁','B₁','C₁','D₁'];break;}

const regArea=(n,a)=>n*a*a/(4*Math.tan(Math.PI/n));

function bodyReadout(b){

    if(!isPi) return lab+' = '+fmt(v);

  }).join('\n');
}
function computeL(){
  let m=5;
  for(const o of st.o3){
    if(!o.visible)continue;
    if(o.type==='point3')m=Math.max(m,Math.abs(o.x)+1,Math.abs(o.y)+1,Math.abs(o.z)+1);
    if(o.type==='pt3c'){const q=cpt3(o);if(q&&q.every(isFinite))m=Math.max(m,...q.map(v=>Math.abs(v)+1));}
    if(o.type==='body'){
      if(o.kind==='sphere'){m=Math.max(m,Math.abs(o.pos.x)+o.p.r+1,Math.abs(o.pos.y)+o.p.r+1,Math.abs(o.pos.z)+o.p.r+1);}
      else bodyMesh(o).V.forEach(v=>{m=Math.max(m,Math.abs(v[0])+1,Math.abs(v[1])+1,Math.abs(v[2])+1);});
    }
  }
  return Math.min(20,Math.ceil(m));
}
/* ---------- 3D constructions ---------- */

const o3ById=id=>st.o3.find(o=>o.id===id);
const isPt3=o=>o&&(o.type==='point3'||o.type==='pt3c');
function ptOf(ref){

function lineRef(ref){

function bodyEdges(b){

function planeRef(ref){
  if(typeof ref==='string'&&ref.startsWith('f:')){const [,bid,fi]=ref.split(':');const b=o3ById(+bid);if(!b)return null;const M=bodyMesh(b),f=M.F[+fi];if(!f)return null;

function refName(ref){
  if(typeof ref==='string'&&ref.startsWith('e:')){const [,bid,i,j]=ref.split(':');const b=o3ById(+bid);if(!b)return '?';const M=bodyMesh(b);return M.labels?M.labels[+i]+M.labels[+j]:'ръба';}

function cpt3(o){

function planeOf(o){

function lineOf3(o){

  switch(o.kind){
    case 'pp':case 'seg':{const A=ptOf(r[0]),B=ptOf(r[1]);if(!A||!B)return null;p=A;u=sub3(B,A);break;}
    case 'perp':{const A=ptOf(r[0]),pl=planeRef(r[1]);if(!A||!pl)return null;p=A;u=pl.n.slice();break;}
    case 'par':{const A=ptOf(r[0]),l=lineRef(r[1]);if(!A||!l)return null;p=A;u=l.u.slice();break;}

function planeAnchors(o,pl){
  const pts=[];

    if(typeof r==='string'&&r.startsWith('e:')){const L=lineRef(r);if(L){pts.push(L.p);pts.push(add3(L.p,L.u));}continue;}
    if(typeof r==='string'&&r.startsWith('f:'))continue;

      if(ob.kind==='pp'||ob.kind==='seg'){const a=ptOf(ob.refs[0]),b=ptOf(ob.refs[1]);if(a)pts.push(a);if(b)pts.push(b);}

function clipLine(p,u,L){

function bodySection(b,pl){

function intVec(arr){

    const g=r.reduce((a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},0)||1;return r.map(x=>x/g);}}
  return null;

function planeEqStr(pl){

  const fi=c.slice(0,3).find(x=>Math.abs(x)>1e-9);if(fi<0)c=c.map(x=>-x);

/* ---------- smart pen ---------- */
function rdp(pts,eps){
  if(pts.length<3)return pts.slice();
  let dmax=0,idx=0;const a=pts[0],b=pts[pts.length-1];
  for(let i=1;i<pts.length-1;i++){const d=distSeg(pts[i][0],pts[i][1],a,b);if(d>dmax){dmax=d;idx=i;}}
  if(dmax>eps){const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r);}
  return [a,b];
}
function recognize(pts){
  if(pts.length<5)return null;
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  for(const p of pts){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);}
  const bw=maxx-minx,bh=maxy-miny,diag=Math.hypot(bw,bh);if(diag<20)return null;
  const f=pts[0],l=pts[pts.length-1],gap=Math.hypot(f[0]-l[0],f[1]-l[1]);
  if(gap>0.3*diag){let dev=0;for(const p of pts)dev=Math.max(dev,distSeg(p[0],p[1],f,l));return dev<Math.max(6,0.08*gap)?{type:'line',a:f,b:l}:null;}
  const cx=(minx+maxx)/2,cy=(miny+maxy)/2,rx=bw/2,ry=bh/2;if(rx<5||ry<5)return null;
  let err=0;for(const p of pts)err+=Math.abs(Math.hypot((p[0]-cx)/rx,(p[1]-cy)/ry)-1);err/=pts.length;
  const roundShape=()=>Math.min(rx,ry)/Math.max(rx,ry)>0.8?{type:'circle',cx,cy,r:(rx+ry)/2}:{type:'ellipse',cx,cy,rx,ry};
  let far=0,fd=-1;pts.forEach((p,i)=>{const d=Math.hypot(p[0]-cx,p[1]-cy);if(d>fd){fd=d;far=i;}});
  const ring=pts.slice(far).concat(pts.slice(0,far));ring.push(ring[0]);
  let v=rdp(ring,0.07*diag);v.pop();
  let again=true;
  while(again&&v.length>3){again=false;
    for(let i=0;i<v.length;i++){const p=v[(i-1+v.length)%v.length],c=v[i],n=v[(i+1)%v.length];
      let ang=Math.abs(Math.atan2(p[1]-c[1],p[0]-c[0])-Math.atan2(n[1]-c[1],n[0]-c[0]));if(ang>Math.PI)ang=2*Math.PI-ang;
      if(ang>Math.PI*0.86||Math.hypot(n[0]-c[0],n[1]-c[1])<0.12*diag){v.splice(i,1);again=true;break;}}}
  if(err<0.08&&v.length>=5)return roundShape();
  if(v.length>=3&&v.length<=8){
    if(v.length===4){
      const axis=v.every((c,i)=>{const n=v[(i+1)%4];let a=Math.abs(Math.atan2(n[1]-c[1],n[0]-c[0]))%(Math.PI/2);return Math.min(a,Math.PI/2-a)<0.21;});
      if(axis)v=[[minx,maxy],[maxx,maxy],[maxx,miny],[minx,miny]];
    }
    let A=0;for(let i=0;i<v.length;i++){const p=v[i],q=v[(i+1)%v.length];A+=p[0]*q[1]-q[0]*p[1];}
    if(A>0)v.reverse();
    let st0=0,best=-Infinity;v.forEach((p,i)=>{const sc=p[1]-0.3*p[0];if(sc>best){best=sc;st0=i;}});
    return {type:'poly',v:v.slice(st0).concat(v.slice(0,st0))};
  }
  if(err<0.13)return roundShape();
  return null;
}
function shapePts(r){
  if(r.type==='line')return [r.a,r.b];
  if(r.type==='poly')return r.v;
  const rx=r.type==='circle'?r.r:r.rx,ry=r.type==='circle'?r.r:r.ry,out=[];
  for(let k=0;k<72;k++){const t=2*Math.PI*k/72;out.push([r.cx+rx*Math.cos(t),r.cy+ry*Math.sin(t)]);}
  return out;
}
function smartTo2D(r){
  const pt=(sx,sy)=>{const hit=hitPoint(sx,sy,false);if(hit)return hit;const [x,y]=snapW(...s2w(sx,sy));
    const ex=st.o2.find(o=>isPt(o)&&o.visible&&Math.hypot(P(o.id).x-x,P(o.id).y-y)<1e-9);return ex?ex.id:newPoint(x,y).id;};
  if(r.type==='line'){const a=pt(...r.a),b=pt(...r.b);if(a===b)return false;addObj2({type:'segment',a,b});return true;}
  if(r.type==='poly'){const ids=r.v.map(p=>pt(p[0],p[1]));if(new Set(ids).size!==ids.length)return false;addObj2({type:'polygon',pts:ids,name:ids.map(nm).join('')});return true;}
  if(r.type==='circle'){const c=pt(r.cx,r.cy),cp=P(c);const [px,py]=snapW(cp.x+r.r/st.v2.scale,cp.y);if(Math.hypot(px-cp.x,py-cp.y)<1e-9)return false;
    addObj2({type:'circle',c,p:newPoint(px,py).id,name:nextCircleName()});return true;}
  if(r.type==='ellipse'){
    const [h,k]=snapW(...s2w(r.cx,r.cy));const g=st.opt.snap?gridInfo().p10:0;let a=r.rx/st.v2.scale,b=r.ry/st.v2.scale;
    if(g){a=Math.max(g,Math.round(a/g)*g);b=Math.max(g,Math.round(b/g)*g);}
    const term=(v,n)=>Math.abs(v)<1e-9?n+'²':'('+n+(v>0?' − ':' + ')+fmt(Math.abs(v))+')²';
    addObj2({type:'implicit',src:term(h,'x')+'/'+fmt(a*a)+' + '+term(k,'y')+'/'+fmt(b*b)+' = 1',F:e=>((e.x-h)/a)**2+((e.y-k)/b)**2-1,params:[]});return true;}
  return false;
}
function finishSmart(s){
  const arr=st.ink[st.mode];const r=recognize(s.pts.map(fromInk));
  if(!r){s.kind='pen';render();return;}
  if(st.mode==='2d'){
    if(smartTo2D(r)){const i=arr.indexOf(s);if(i>=0)arr.splice(i,1);st.hist['2d'].pop();changed();}
    else{s.kind='pen';render();}
    return;
  }
  s.kind='pen';s.straight=true;s.closed=r.type!=='line';s.pts=shapePts(r).map(p=>toInk(p[0],p[1]));render();
}

function placeImage(url){

    if(Math.max(w,h)>M){const k=M/Math.max(w,h);const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);im=new Image();im.onload=render;im.src=c.toDataURL('image/jpeg',0.9);w=c.width;h=c.height;}
    const k=Math.min(1,(W*0.55)/w,(H*0.6)/h),sw=w*k,sh=h*k,sx=(W-sw)/2,sy=(H-sh)/2;
    const s={kind:'image',img:im,pts:[toInk(sx,sy)],w:st.mode==='2d'?sw/st.v2.scale:sw,h:st.mode==='2d'?sh/st.v2.scale:sh};
    snapshot();st.ink[st.mode].push(s);st.selImg=s;setTool('move');

let dlNS;
async function saveFile(name,blob){
  if(window.claude&&typeof window.claude.use==='function'){
    if(dlNS===undefined){try{dlNS=await window.claude.use('downloads');}catch(e){dlNS=null;}}
    if(dlNS){
      try{await dlNS.save({filename:name,data:blob});say('Записах '+name+'.','ok');}
      catch(e){const c=e&&e.code;if(c==='declined')return;say(c==='rate_limited'?'Изчакай малко и опитай пак.':'Записът не успя тук. Опитай от изтегления файл.','err');}
      return;
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);say('Записах '+name+'.','ok');
}
function jpegBytes(c){const b=atob(c.toDataURL('image/jpeg',0.92).split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function buildPdf(pages){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length;};
  const obj=(id,body)=>{offs[id]=len;push(id+' 0 obj\n');body();push('\nendobj\n');};
  push('%PDF-1.4\n');
  const n=pages.length;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  pages.forEach((pg,i)=>{
    const pid=3+i*3,cid=pid+1,iid=pid+2,portrait=pg.h>pg.w;
    const PW=portrait?595.28:841.89,PH=portrait?841.89:595.28,m=24,k=Math.min((PW-2*m)/pg.w,(PH-2*m)/pg.h);
    const w=pg.w*k,h=pg.h*k,x=(PW-w)/2,y=(PH-h)/2;
    obj(pid,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im'+i+' '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>'));
    const cs='q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im'+i+' Do Q';
    obj(cid,()=>{push('<< /Length '+cs.length+' >>\nstream\n');push(cs);push('\nendstream');});
    obj(iid,()=>{push('<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.data.length+' >>\nstream\n');push(pg.data);push('\nendstream');});
  });
  const total=3+n*3,xref=len;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x);push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
function wrapText(g,text,maxW){
  const words=text.split(' '),out=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}
  if(cur)out.push(cur);return out;
}
function listPages(){
  const lines=[],objs=st.mode==='2d'?st.o2:st.o3;
  st.sliders.forEach(sl=>lines.push(sl.name+' = '+fmt(sl.value)));
  objs.forEach(o=>{if(o.type==='body'){lines.push(o.name);bodyReadout(o).split('\n').forEach(l=>lines.push('      '+l));}else lines.push(describe(o));});
  if(!lines.length)return [];
  const Wp=1240,Hp=1754,m=110,lh=46,pages=[];let g,y;
  const newPage=()=>{const c=document.createElement('canvas');c.width=Wp;c.height=Hp;g=c.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,Wp,Hp);g.fillStyle='#1B2638';y=m;
    if(!pages.length){g.font='600 40px "Golos Text",system-ui,sans-serif';g.fillText('Обекти и мерки',m,y);y+=84;}
    g.font='28px "Golos Text",system-ui,sans-serif';pages.push(c);};
  newPage();
  for(const ln of lines){if(/\u0001/.test(ln)){if(y>Hp-m)newPage();drawMarked(g,ln,m,y,{font:'28px "Golos Text",system-ui,sans-serif',color:'#1B2638',size:28});g.font='28px "Golos Text",system-ui,sans-serif';y+=lh;continue;}
  for(const part of wrapText(g,ln,Wp-2*m)){if(y>Hp-m)newPage();g.fillText(part,m,y);y+=lh;}}
  return pages;
}
function withExportTheme(fn){
  const root=document.documentElement,prev=root.getAttribute('data-theme'),hv=st.hover;
  root.setAttribute('data-theme','light');st.exporting=true;
  try{return fn();}
  finally{if(prev===null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',prev);st.exporting=false;setMode(st.mode);st.hover=hv;}
}
function capturePages(conv){
  const out=[];savePage();const keep=curPage;
  try{
    for(let i=0;i<pages.length;i++){
      applyPage(i);if(raf){cancelAnimationFrame(raf);raf=0;}draw();out.push(conv(cv));
      if(st.opt.exportList)listPages().forEach(c=>out.push(conv(c)));
    }
  }finally{applyPage(keep);}
  return out;
}
async function exportPdf(){
  let blob;
  try{blob=withExportTheme(()=>buildPdf(capturePages(c=>({w:c.width,h:c.height,data:jpegBytes(c)}))));}
  catch(e){console.error(e);say('Не успях да създам PDF.','err');}
  if(blob)await saveFile('chertozhna-daska.pdf',blob);
}
function printAll(){
  const old=document.getElementById('printArea');if(old)old.remove();
  let imgs;
  try{imgs=withExportTheme(()=>capturePages(c=>({w:c.width,h:c.height,url:c.toDataURL('image/png')})));}
  catch(e){console.error(e);say('Не успях да подготвя печата.','err');return;}
  const area=el('div');area.id='printArea';let portrait=false;
  imgs.forEach(p=>{const im=el('img');im.alt='';im.src=p.url;if(p.h>p.w){im.className='portrait';portrait=true;}area.append(im);});
  const style=el('style');style.id='printPage';style.textContent=portrait?'@page{margin:10mm}':'@page{size:landscape;margin:10mm}';
  const oldSt=document.getElementById('printPage');if(oldSt)oldSt.remove();
  document.body.append(area,style);
  const cleanup=()=>{area.remove();style.remove();window.removeEventListener('afterprint',cleanup);};
  window.addEventListener('afterprint',cleanup);
  Promise.all([...area.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):null)).then(()=>{
    try{window.print();}catch(e){cleanup();say('Браузърът не позволи печат тук. Запази PDF и го принтирай от него.','err');}
  });
}

/* ---------- pages ---------- */
const PAGE_KEYS=['mode','o2','o3','ink','hist','sliders','v2','v3'];
const pages=[{}];let curPage=0;
function blankPage(mode){return {mode,o2:[],o3:[],ink:{'2d':[],'3d':[]},hist:{'2d':[],'3d':[]},sliders:[],v2:{cx:0,cy:0,scale:50},v3:{yaw:-1.9,pitch:0.42,zoom:1}};}
const cloneInk=s=>Object.assign({},s,{pts:s.pts.map(q=>q.slice())});
function savePage(){const p={};PAGE_KEYS.forEach(k=>p[k]=st[k]);pages[curPage]=p;}
function applyPage(i){
  curPage=i;const p=pages[i];PAGE_KEYS.forEach(k=>st[k]=p[k]);st.pending=[];st.selImg=null;st.hover=null;
  for(const k of Object.keys(ENV))delete ENV[k];
  st.sliders.forEach(sl=>{ENV[sl.name]=sl.value;sl.playing=false;});
}
function updatePageBar(){
  $('#pgNum').textContent=(curPage+1)+' / '+pages.length;
  $('#pgPrev').disabled=curPage===0;$('#pgNext').disabled=curPage===pages.length-1;
}
function goPage(i){if(i<0||i>=pages.length||i===curPage)return;savePage();applyPage(i);setMode(st.mode);updatePageBar();}
function addPage(copy){
  savePage();let p;
  if(copy){const c=pages[curPage];
    p={mode:c.mode,o2:c.o2.map(o=>Object.assign({},o)),
      o3:c.o3.map(o=>Object.assign({},o,o.p?{p:Object.assign({},o.p)}:{},o.pos?{pos:Object.assign({},o.pos)}:{})),
      ink:{'2d':c.ink['2d'].map(cloneInk),'3d':c.ink['3d'].map(cloneInk)},hist:{'2d':[],'3d':[]},
      sliders:c.sliders.map(sl=>Object.assign({},sl,{playing:false,ui:null})),v2:Object.assign({},c.v2),v3:Object.assign({},c.v3)};}
  else p=blankPage(st.mode);
  pages.splice(curPage+1,0,p);applyPage(curPage+1);setMode(st.mode);updatePageBar();
  say(copy?'Копирах страницата. Промените тук не засягат оригинала.':'Добавих нова страница.','ok');
}
function delPage(btn){
  if(pages.length<2){say('Това е единствената страница.','err');return;}
  if(!btn.classList.contains('warn')){btn.classList.add('warn');say('Докосни кошчето още веднъж, за да изтриеш страница '+(curPage+1)+'.','err');
    clearTimeout(btn.t);btn.t=setTimeout(()=>btn.classList.remove('warn'),3000);return;}
  btn.classList.remove('warn');pages.splice(curPage,1);applyPage(Math.min(curPage,pages.length-1));setMode(st.mode);updatePageBar();say('Изтрих страницата.','ok');
}

/* ---------- render loop ---------- */
let raf=0;
function render(){if(!raf)raf=requestAnimationFrame(draw);}
function draw(){
  raf=0;const T=theme();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=T.paper;ctx.fillRect(0,0,W,H);
  try{st.mode==='2d'?render2D(T):render3D(T);}catch(e){console.error(e);}
  ctx.globalAlpha=1;
  try{drawInk(T);}catch(e){console.error(e);}
  if(typeof scheduleSave==='function')scheduleSave();
  $('#quick').hidden=!(st.mode==='2d'&&st.tool==='tangpoly'&&st.pending.length===1);
  updateReadouts();
}

/* ---------- list ---------- */
function describe(o){
  switch(o.type){
    case 'vec':case 'vexpr':{const V=vecOf(o);const n=o.type==='vec'?'\u0001'+nm(o.a)+nm(o.b)+'\u0002':o.src;if(!V)return n;
      const L=Math.hypot(V.v.x,V.v.y);
      return (o.type==='vec'?'вектор ':'')+n+(o.type==='vexpr'?' (от '+nm(o.start)+')':'')+': ('+fmt(V.v.x)+'; '+fmt(V.v.y)+'), |'+n+'| = '+fmt(L);}
    case 'bisect':{const V=P(o.v),Lf=bisFoot(o),lo=st.o2.find(x=>x.type==='bisL'&&x.bis===o.id),ln=lo?lo.name:'L';
      const A=P(o.a),B=P(o.b),va=Math.hypot(A.x-V.x,A.y-V.y),vb=Math.hypot(B.x-V.x,B.y-V.y);
      return 'ъглополовяща на ∠'+nm(o.a)+nm(o.v)+nm(o.b)+': '+nm(o.v)+ln+(Lf?' = '+fmt(Math.hypot(Lf.x-V.x,Lf.y-V.y)):'')+', '+nm(o.a)+ln+' : '+ln+nm(o.b)+' = '+fmt(va/vb);}
    case 'point':case 'mid':case 'cpoint':case 'fpoint':case 'center':case 'tpv':case 'bisL':case 'ipt':{const p=P(o.id);let s=o.name+'('+fmt(p.x)+'; '+fmt(p.y)+')';
      if(o.type==='ipt'){const nmS=shapeName(o.a)+' и '+shapeName(o.b);if(!isFinite(p.x))return o.name+': пресечната точка на '+nmS+' не съществува';s+=', пресечна точка на '+nmS;}
      if(o.type==='bisL'){const bo=byId(o.bis);if(bo)s+=', петата на ъглополовящата от '+nm(bo.v)+' върху '+nm(bo.a)+nm(bo.b);}
      if(o.type==='mid')s+=', среда на '+nm(o.a)+nm(o.b);
      if(o.type==='cpoint')s+=', върху '+nm(o.c);
      if(o.type==='fpoint')s+=', върху графиката на '+nm(o.f);
      if(o.type==='center'){const c=byId(o.of);s+=c&&c.type==='circ3'?', център на описаната окръжност':', център на вписаната окръжност';}
      return s;}
    case 'ftan':{const L=lineOf(o);const g=byId(o.p);return 'допирателна към '+(g?nm(g.f):'?')+' в '+nm(o.p)+': '+(L?lineEq(L.p,L.d):'няма');}
    case 'ctan':{const L=lineOf(o);if(!L)return 'допирателна от '+nm(o.p)+' към '+nm(o.c)+': няма (точката е вътре)';
      const C=circleOf(byId(o.c)),p=P(o.p),len=Math.sqrt(Math.max(0,(p.x-C.x)**2+(p.y-C.y)**2-C.r*C.r));
      return 'допирателна от '+nm(o.p)+' към '+nm(o.c)+': '+lineEq(L.p,L.d)+(len>0.005?', допирателна отсечка = '+fmt(len):'');}
    case 'tangpoly':{const vs=tangPolyVerts(o);const names=st.o2.filter(x=>x.type==='tpv'&&x.poly===o.id).sort((a,b)=>a.i-b.i).map(x=>x.name).join('');
      if(vs.some(v=>!isFinite(v.x)))return names+': допирателните в две съседни точки са успоредни';
      const s=polyStatsPts(vs);return names+' (описан около '+nm(o.c)+'): S = '+fmt(s.S)+', P = '+fmt(s.P);}
    case 'segment':{const a=P(o.a),b=P(o.b);return nm(o.a)+nm(o.b)+' = '+fmt(Math.hypot(b.x-a.x,b.y-a.y));}
    case 'line':case 'perp':case 'par':{
      const L=lineOf(o);const eq=L?lineEq(L.p,L.d):'';
      if(o.type==='line')return 'права '+nm(o.a)+nm(o.b)+': '+eq;
      const base=byId(o.l);const bn=base&&o.e!=null?edgeName(base,o.e):base&&(base.type==='segment'||base.type==='line'||base.type==='vec')?nm(base.a)+nm(base.b):'правата';
      return (o.type==='perp'?'⊥ ':'∥ ')+bn+' през '+nm(o.p)+': '+eq;}
    case 'circle':case 'circ3':case 'incircle':{const C=circleOf(o);if(!C)return o.name+': няма такава окръжност (точките са на една права)';
      const t=(v,s)=>Math.abs(v)<0.005?s+'²':'('+s+(v>0?' − ':' + ')+fmt(Math.abs(v))+')²';
      const tri=o.type==='circle'?'':nm(o.a)+nm(o.b)+nm(o.c);
      const pre=o.type==='circ3'?' описана около '+tri+',':o.type==='incircle'?' вписана в '+tri+',':'';
      return o.name+':'+pre+' r = '+fmt(C.r)+', '+t(C.x,'x')+' + '+t(C.y,'y')+' = '+fmt(C.r*C.r);}
    case 'polygon':{const s=polyStats(o.pts);return o.pts.map(nm).join('')+': S = '+fmt(s.S)+', P = '+fmt(s.P);}
    case 'angle':return '∠'+nm(o.a)+nm(o.v)+nm(o.b)+' = '+fmt(angleInfo(o),1)+'°';
    case 'func':return o.name+'(x) = '+o.src;
    case 'vline':case 'implicit':return o.src;
    case 'plane':case 'plane3':{
      const pl=planeOf(o);if(!pl)return o.name+': не е определена';
      const R=o.refs||[],nmr=refName;let d='';
      if(o.type==='plane3')d={ppp:' = ('+R.map(nmr).join('')+')',ll:', през '+nmr(R[0])+' и '+nmr(R[1]),lp:', през '+nmr(R[0])+' и '+nmr(R[1]),ppar:', през '+nmr(R[1]===undefined?R[0]:R[0])+' ∥ '+nmr(R[1]),pperp:', през '+nmr(R[0])+' ⊥ '+nmr(R[1]),lperp:', през '+nmr(R[0])+' ⊥ '+nmr(R[1])}[o.kind]||'';
      let t=o.name+d+(o.type==='plane'?': '+o.src:st.opt.coords3?': '+planeEqStr(pl):'');
      if(st.opt.sections)st.o3.forEach(b=>{if(b.type!=='body'||!b.visible)return;const sp=bodySection(b,pl);if(sp)t+='; сечение с '+b.name+': S = '+fmt(area3(sp));});
      return t;}
    case 'line3':{const l=lineOf3(o);const R=o.refs,nmr=refName;
      if(o.kind==='seg'){const a=ptOf(R[0]),b=ptOf(R[1]);return 'отсечка '+o.name+(a&&b?' = '+fmt(len3(sub3(b,a))):'');}
      const d={pp:'права '+nmr(R[0])+nmr(R[1]),perp:'през '+nmr(R[0])+', ⊥ '+nmr(R[1]),par:'през '+nmr(R[0])+', ∥ '+nmr(R[1]),par2:'през '+nmr(R[0])+', ∥ '+nmr(R[1])+' и ∥ '+nmr(R[2]),int:nmr(R[0])+' ∩ '+nmr(R[1])}[o.kind];
      return o.name+': '+d+(l?(st.opt.coords3?', посока '+vecStr(l.u):''):', не е определена');}
    case 'pt3c':{const q=cpt3(o);let t=o.name+(q?(st.opt.coords3?'('+q.map(x=>fmt(x)).join('; ')+')':''):': не е определена');
      if(o.kind==='foot'){const P=ptOf(o.refs[0]);t+=', петата на перпендикуляра от '+refName(o.refs[0])+' към '+refName(o.refs[1]);if(q&&P)t+=', '+refName(o.refs[0])+o.name+' = '+fmt(len3(sub3(P,q)));}
      else if(o.kind==='onseg'){const A=refName(o.refs[0]),B=refName(o.refs[1]);t+=' върху '+A+B+(o.t>0.001&&o.t<0.999?', '+A+o.name+' : '+o.name+B+' = '+fmt(o.t/(1-o.t)):'');}
      else if(o.kind==='online')t+=' върху правата '+refName(o.refs[0]);
      else if(o.kind==='onface')t+=' от стената '+o.face;
      else if(o.kind==='onplane')t+=' от равнината '+refName(o.refs[0]);
      else if(o.kind==='mid')t+=', среда на '+refName(o.refs[0])+refName(o.refs[1]);
      else if(o.kind==='ratio'){const A=refName(o.refs[0]),B=refName(o.refs[1]);t+=' върху '+A+B+', '+A+o.name+' : '+o.name+B+' = '+fmt(o.k);}
      else t+=', '+refName(o.refs[0])+' ∩ '+refName(o.refs[1]);
      return t;}
    case 'surface':return o.src;
    case 'point3':return st.opt.coords3?o.name+'('+fmt(o.x)+'; '+fmt(o.y)+'; '+fmt(o.z)+')':o.name+(o.tapped?', точка в пространството':'');
    case 'body':return o.name;
  }
  return '';
}
function lineEq(p,d){
  if(Math.abs(d.x)<1e-9*(Math.abs(d.y)+1))return 'x = '+fmt(p.x);
  const k=d.y/d.x,n=p.y-k*p.x;const kr=Math.round(k*100)/100;
  let s=Math.abs(kr)<1e-9?'':kr===1?'x':kr===-1?'−x':fmt(k)+'x';
  if(Math.abs(n)>=0.005)s=s?s+(n<0?' − ':' + ')+fmt(Math.abs(n)):fmt(n);else if(!s)s='0';
  return 'y = '+s;
}

function objItem(o){
  const li=el('li','item'+(o.visible?'':' off'));li.style.setProperty('--c',o.color);
  const dot=el('button','dot');dot.type='button';dot.setAttribute('aria-label',o.visible?'Скрий':'Покажи');dot.title='Покажи или скрий';
  dot.onclick=()=>{o.visible=!o.visible;li.classList.toggle('off',!o.visible);dot.setAttribute('aria-label',o.visible?'Скрий':'Покажи');render();};
  const desc=el('div','desc');
  if(o.type==='body'){desc.append(el('strong',null,o.name));}else{desc.dataset.id=o.id;setRich(desc,describe(o));}
  const del=el('button','del','×');del.type='button';del.setAttribute('aria-label','Изтрий');
  del.onclick=()=>{if(st.mode==='2d')deleteObj2(o.id);else deleteObj3(o.id);changed();};
  const cb=el('button','cbtn');cb.type='button';cb.title='Цвят';cb.setAttribute('aria-label','Смени цвета');
  const cpal=el('div','cpal');cpal.hidden=true;
  [...new Set([...PALETTE,'#3A4556','#7A8699'])].forEach(c=>{const b=el('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Цвят '+c);b.setAttribute('aria-pressed',o.color===c);
    b.onclick=()=>{o.color=c;li.style.setProperty('--c',c);cpal.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cpal.hidden=true;render();};cpal.append(b);});
  const FILLDEF={polygon:0.16,tangpoly:0.14,angle:0.2,plane:0.33,plane3:0.33,surface:0.82,body:-1};
  if(o.type in FILLDEF){
    const def=o.type==='body'?(o.kind==='sphere'?(st.opt.transp?0.5:1):(st.opt.transp?0.4:1)):FILLDEF[o.type];
    const lab=el('label','oprow');lab.append(el('span',null,o.type==='body'?'Плътност на стените':'Плътност на запълването'));
    const r=el('input');r.type='range';r.min='0';r.max='100';r.step='5';r.value=String(Math.round((o.fill==null?def:o.fill)*100));
    const out=el('span','opv',r.value+'%');r.oninput=()=>{o.fill=(+r.value)/100;out.textContent=r.value+'%';render();};
    lab.append(r,out);cpal.append(lab);}

          const ids=poly.pts.filter(id=>byId(id).type==='point');drag.sc={c,orig:ids.map(id=>({o:byId(id),x:byId(id).x,y:byId(id).y})),v0:{x:o.x-c.x,y:o.y-c.y}};}
        const sc=drag.sc,l2=sc.v0.x*sc.v0.x+sc.v0.y*sc.v0.y;
        if(l2>1e-12){const k=Math.max(0.05,((wx-sc.c.x)*sc.v0.x+(wy-sc.c.y)*sc.v0.y)/l2);
          sc.orig.forEach(q=>{q.o.x=sc.c.x+(q.x-sc.c.x)*k;q.o.y=sc.c.y+(q.y-sc.c.y)*k;});}
        render();return;
      }
    }
    if(o.type==='point'){const [x,y]=snapW(wx,wy);o.x=x;o.y=y;}
    else if(o.type==='cpoint'){const C=circleOf(byId(o.c));if(C){let t=Math.atan2(wy-C.y,wx-C.x);if(st.opt.snap){const s=Math.PI/12,r=Math.round(t/s)*s;if(Math.abs(t-r)<0.05)t=r;}o.t=t;}}
    else if(o.type==='fpoint')o.x=snapX(wx);
    render();}
  else if(drag.kind==='pan'){st.v2.cx=drag.cx-(sx-drag.sx)/st.v2.scale;st.v2.cy=drag.cy+(sy-drag.sy)/st.v2.scale;render();}
  else if(drag.kind==='rot'){st.v3.yaw=drag.yaw+(sx-drag.sx)*0.01;st.v3.pitch=Math.max(-1.45,Math.min(1.45,drag.pitch+(sy-drag.sy)*0.01));render();}
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(drag&&drag.kind==='pinch'){if(ptrs.size===0)drag=null;return;}
  if(drag&&drag.kind==='ink'&&drag.s.kind==='smart'){if(e.type==='pointerup')finishSmart(drag.s);else drag.s.kind='pen';}
  if(drag&&drag.kind==='text'&&down&&!down.moved&&e.type==='pointerup')openText(down.sx,down.sy);
  if(drag&&drag.kind==='erase'&&!drag.erased)st.hist[st.mode].pop();
  if(drag&&drag.kind==='rot'&&drag.tap&&down&&!down.moved&&e.type==='pointerup')placePt3(down.sx,down.sy);
  if(drag&&(drag.kind==='p3'||(drag.kind==='vtx'&&drag.conv)))renderList();
  if(drag&&down&&!down.moved&&st.mode==='2d'&&st.tool!=='move'&&!isBoard(st.tool)&&e.type==='pointerup')onToolTap(down.sx,down.sy);
  if(drag&&drag.kind==='point')renderList();
  drag=null;down=null;
  updateCursor();
}

const SAVE_KEY='chertozhna-daska-save';let saveReady=false,saveT=0;
function hasContent(ps){return ps.some(p=>p.o2.length||p.o3.length||p.ink['2d'].length||p.ink['3d'].length||p.sliders.length);}
function saveNow(){
  if(!saveReady||st.exporting)return;
  try{
    savePage();
    if(!hasContent(pages)){localStorage.removeItem(SAVE_KEY);return;}
    const data={v:1,t:Date.now(),cur:curPage,opt:st.opt,pages:pages.map(p=>({mode:p.mode,o2:p.o2,o3:p.o3,ink:p.ink,sliders:p.sliders,v2:p.v2,v3:p.v3}))};
    const rep=withImg=>(k,v)=>{if(typeof v==='function'||k==='ui'||k==='_anc')return undefined;if(k==='img')return withImg&&v?v.src:undefined;return v;};
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(data,rep(true)));}
    catch(e){localStorage.setItem(SAVE_KEY,JSON.stringify(data,rep(false)));}
  }catch(e){}
}
function scheduleSave(){if(!saveReady)return;clearTimeout(saveT);saveT=setTimeout(saveNow,1200);}
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});
function rehydrate(o,mode){
  try{
    const two=(src,R)=>{const i=src.indexOf('=');return [compile(src.slice(0,i),R).f,compile(src.slice(i+1),R).f];};
    if(mode==='2d'){
      if(o.type==='func')o.f=compile(o.src,['x','y']).f;
      else if(o.type==='vline')o.f=compile(o.src.slice(o.src.indexOf('=')+1),['x','y']).f;
      else if(o.type==='implicit'){const [A,B]=two(o.src,['x','y']);o.F=e=>A(e)-B(e);}
    } else {
      if(o.type==='plane'){const [A,B]=two(o.src,['x','y','z']);o.G=e=>A(e)-B(e);}
      else if(o.type==='surface')o.f=compile(o.src.slice(o.src.indexOf('=')+1),['x','y','z']).f;
    }
    return true;
  }catch(e){return false;}
}
function restoreSave(data){
  pages.length=0;
  data.pages.forEach(p=>{
    p.o2=(p.o2||[]).filter(o=>rehydrate(o,'2d'));p.o3=(p.o3||[]).filter(o=>rehydrate(o,'3d'));
    p.ink=p.ink||{'2d':[],'3d':[]};['2d','3d'].forEach(m=>{p.ink[m]=(p.ink[m]||[]).filter(s=>s.kind!=='image'||typeof s.img==='string');
      p.ink[m].forEach(s=>{if(s.kind==='image'){const im=new Image();im.onload=render;im.src=s.img;s.img=im;}});});
    p.hist={'2d':[],'3d':[]};p.sliders=(p.sliders||[]).map(sl=>Object.assign(sl,{playing:false}));
    pages.push(p);
  });
  let mx=0;pages.forEach(p=>[...p.o2,...p.o3].forEach(o=>{if(o.id>mx)mx=o.id;}));uid=mx+1;
  if(data.opt)Object.assign(st.opt,data.opt);
  document.querySelectorAll('[data-opt]').forEach(c=>{c.checked=!!st.opt[c.dataset.opt];});
  document.querySelectorAll('[data-optsel]').forEach(sel=>{sel.value=String(st.opt[sel.dataset.optsel]);});
  curPage=-1;applyPage(Math.min(data.cur||0,pages.length-1));setMode(st.mode);updatePageBar();
}
function initResume(){
  let data=null;
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw)data=JSON.parse(raw);}catch(e){}
  if(!data||!data.pages||!data.pages.length){saveReady=true;return false;}
  const box=$('#resume'),when=new Date(data.t);
  $('#resumeImg').src=$('#geoBtn img').src;
  let ds='';try{ds=when.toLocaleString('bg-BG',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});}catch(e){ds=when.toLocaleString();}
  const n=data.pages.length;
  $('#resumeText').textContent='Намерих запазена работа от '+ds+(n>1?' ('+n+' страници)':'')+'. Искаш ли да продължиш от там, откъдето спря?';
  box.hidden=false;$('#resumeYes').focus();
  $('#resumeYes').onclick=()=>{box.hidden=true;try{restoreSave(data);say('Продължаваш от запазената работа.','ok');}catch(e){console.error(e);say('Не успях да възстановя запазената работа.','err');}saveReady=true;};
  $('#resumeNo').onclick=()=>{box.hidden=true;try{localStorage.removeItem(SAVE_KEY);}catch(e){}saveReady=true;};
  return true;
}
